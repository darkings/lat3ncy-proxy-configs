name: Validate proxy configurations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2

      - name: Validate PowerShell contracts
        shell: pwsh
        run: |
          ./tests/Test-LoonConfigs.ps1
          ./tests/Test-StashIosConfig.ps1
          ./tests/Test-MicrosoftCnRule.ps1
          ./tests/Test-Readme.ps1
          ./tests/Test-StellibertyConfig.ps1
          ./tests/Test-PinduoduoCleanup.ps1
          ./tests/Test-DocumentPolicy.ps1
          ./tests/Test-DeployDryRun.ps1

      - name: Validate publish transaction/rollback/retention logic
        shell: bash
        run: bash tests/test_publish_transaction.sh

      - name: Byte-compile Python tooling, converter stack and tests
        # scripts/*.py covers the converter orchestrator, kelee_config,
        # kelee_assets, kelee_diagnostics, kelee_enhancements, kelee_semantics,
        # loon_expr (Loon expression parser), the validator and the generators.
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Validate Loon expression parser
        run: python tests/test_loon_expr.py

      - name: Validate KeLee conversion semantics
        run: python tests/test_kelee_conversion.py

      - name: Loon action variables / rule quoting
        run: python tests/test_kelee_variables.py

      - name: Validate KeLee build orchestrator (content-addressed assets, fingerprint, page)
        run: python tests/test_kelee_build.py

      - name: Validate KeLee update state / retry semantics
        run: python tests/test_kelee_update_state.py

      - name: Validate verifier suites (skip cleanly until/unless they land)
        # The conversion verifier adds schema/audit/spotify repro tests over
        # time; run them when present. The audit/spotify repros skip themselves
        # when `.local/upstream-audit` is absent (never required in CI).
        run: |
          set -euo pipefail
          for test in \
            tests/test_validate_stash.py \
            tests/test_audit_conversion.py \
            tests/test_spotify_argument_repro.py \
            tests/test_loon_expr.py; do
            if [ -f "$test" ]; then
              echo "::group::python $test"
              python "$test"
              echo "::endgroup::"
            else
              echo "not present yet (skipped): $test"
            fi
          done

      - name: Build + validate a fixture bundle offline (structure and completeness)
        # Real parse + structure + completeness validation of generated output:
        # build the committed fixture bundle with the real converter/resolver/
        # validator (no network) and validate it independently.
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/kelee-validate-bundle"
          set +e
          python scripts/check_kelee_update.py \
            --out-dir "$out" \
            --snapshot-dir tests/fixtures/build \
            --public-base https://validate.invalid \
            --json-report "$RUNNER_TEMP/kelee-validate-report.json" \
            --quiet
          code=$?
          set -e
          # 0 = already up to date, 2 = built; anything else is a failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "KeLee fixture build failed with exit code $code"
            exit "$code"
          fi
          python scripts/validate_stash.py \
            --dir "$out" \
            --targets "$out/targets.json" \
            --public-base https://validate.invalid
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'kelee-validate-bundle'
          manifest = json.loads((root / '.build-manifest.json').read_text(encoding='utf-8'))
          required = {'schema', 'public_base', 'fingerprint', 'sources', 'resources', 'outputs',
                      'target_results', 'totals', 'errors', 'warnings'}
          missing = required - set(manifest)
          assert not missing, f'manifest missing fields: {sorted(missing)}'
          assert manifest['public_base'] == 'https://validate.invalid'
          assert not manifest['errors'], manifest['errors']
          for relpath, meta in manifest['outputs'].items():
              assert (root / relpath).is_file(), f'missing output: {relpath}'
          providers = (root / 'kelee-scripts.stoverride').read_text(encoding='utf-8')
          assert 'script-providers:' in providers, 'provider bundle has no providers'
          html = (root / 'index.html').read_text(encoding='utf-8')
          assert 'https://validate.invalid' in html
          # No stale default host may survive anywhere in the generated bundle
          # (overrides, provider bundle, page, targets.json, manifest, assets).
          stale_host = 'stale.invalid'
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              assert stale_host not in text, f'stale default host in generated file: {path}'
          print(f'PASS: fixture bundle validated ({len(manifest["outputs"])} outputs, '
                f'{len(manifest["providers"])} providers)')
          PY

      - name: Validate Stash routing when remote rules are unavailable
        run: python tests/test_stash_routing.py

      - name: Validate private Stash country group generator
        run: python tests/test_stash_countries.py

      - name: Validate generated Loon configurations
        run: python scripts/generate_loon_configs.py --check

      - name: Parse YAML configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          stelliberty = yaml.safe_load(Path('stelliberty-override.yaml').read_text(encoding='utf-8'))
          assert isinstance(stelliberty, dict)
          assert stelliberty['rule-providers']['Google']['format'] == 'mrs'
          assert stelliberty['rules'].index('RULE-SET,YouTube,YouTube') < stelliberty['rules'].index('RULE-SET,Google,Google')

          stash = yaml.safe_load(Path('stash-ios.yaml').read_text(encoding='utf-8'))
          assert isinstance(stash, dict)
          assert stash['proxies'][0]['type'] == 'tailscale'
          assert stash['proxy-providers']['SubStore']['url'] == 'http://sub.store/download/ios?target=Stash'
          assert stash['subscribe-url'] == 'http://sub.store/download/ios?target=Stash'
          provider_groups = {'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States'}
          for group in stash['proxy-groups']:
              if group['name'] in provider_groups:
                  assert group['use'] == ['SubStore']
          proxy = next(g for g in stash['proxy-groups'] if g['name'] == 'Proxy')
          assert 'use' not in proxy, 'Proxy must stay group-only at the top level'
          assert proxy['proxies'] == ['Auto', 'DIRECT', 'Hong Kong', 'Taiwan', 'Japan', 'Singapore', 'United States']
          auto = next(g for g in stash['proxy-groups'] if g['name'] == 'Auto')
          assert auto['use'] == ['SubStore'], 'Auto must latency-test every subscription node'
          assert 'proxies' not in auto, 'Auto must not be rewritten into a country-group list'
          assert stash['rules'].index('DOMAIN-SUFFIX,ts.net,Tailscale') < stash['rules'].index('MATCH,Proxy')

          pinduoduo = yaml.safe_load(Path('stash/overrides/pinduoduo-cleanup.stoverride').read_text(encoding='utf-8'))
          assert isinstance(pinduoduo, dict)
          assert 'api.pinduoduo.com' in pinduoduo['http']['mitm']
          assert pinduoduo['script-providers']['pinduoduo-homepage-cleanup']['url'].startswith('https://cdn.jsdelivr.net/')
          print('PASS: Stash, Stash override, and Stelliberty YAML parse and rule ordering')
          PY

      - name: Audit remote resources
        run: python scripts/check_remote_resources.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
