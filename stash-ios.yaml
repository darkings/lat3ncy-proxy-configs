# Complete first-time login from this node's "Tailscale Authentication" page.
# auth-key and exit-node are deliberately omitted from the public configuration.
proxies:
  - name: Tailscale-Node
    type: tailscale
    hostname: ios
    control-url: https://controlplane.tailscale.com
    ephemeral: false
    # This node is for Tailnet resources and has no required public exit node.
    benchmark-disabled: true

# The fixed name is public, while the private airport URL remains only in the
# local Sub-Store database. Do not replace this with the private source URL.
proxy-providers:
  SubStore:
    url: "http://sub.store/download/ios?target=Stash"
    path: ./providers/substore-ios.yaml
    interval: 3600
    headers:
      User-Agent: Stash

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).+$'
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png

  - name: Tailscale
    type: select
    proxies:
      - Tailscale-Node

  - name: Spotify
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png

  - name: Telegram
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png

  - name: OpenAI
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png

  - name: GitHub
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/github.png

  - name: Microsoft
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png

  - name: Google
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png

  - name: YouTube
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/YouTube.png

  - name: TikTok
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TikTok.png

  - name: Auto
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).+$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png

  - name: Hong Kong
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:剩余|流量|套餐|到期|过期|有效期|已用|重置|TRAFFIC|EXPIRE|REMAINING|RESET)).*(?:香港|港|🇭🇰|\bHK\b|Hong[ -]?Kong).*$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png

  - name: Taiwan
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:剩余|流量|套餐|到期|过期|有效期|已用|重置|TRAFFIC|EXPIRE|REMAINING|RESET)).*(?:台湾|台灣|臺灣|台北|臺北|🇹🇼|\bTW\b|Taiwan|Taipei).*$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png

  - name: Japan
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:剩余|流量|套餐|到期|过期|有效期|已用|重置|TRAFFIC|EXPIRE|REMAINING|RESET)).*(?:日本|东京|東京|大阪|🇯🇵|\bJP\b|Japan|Tokyo|Osaka).*$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png

  - name: Singapore
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:剩余|流量|套餐|到期|过期|有效期|已用|重置|TRAFFIC|EXPIRE|REMAINING|RESET)).*(?:新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore).*$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png

  - name: United States
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:剩余|流量|套餐|到期|过期|有效期|已用|重置|TRAFFIC|EXPIRE|REMAINING|RESET)).*(?:美国|美國|🇺🇸|\bUS(?:A)?\b|United[ -]?States|America|Los[ -]?Angeles|San[ -]?Jose|Seattle|New[ -]?York).*$'
    interval: 600
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

