# Stash iOS configuration
# Requires Stash iOS 3.4+ for the native Tailscale proxy type.
# Add private proxy providers locally; do not publish subscription URLs or auth keys.

mode: rule
log-level: warning
allow-lan: false
ipv6: true

# Stash uses this endpoint to read Subscription-Userinfo (traffic/expiry).
# The local Sub-Store subscription named "ios" must keep flow lookup enabled.
subscribe-url: "http://sub.store/download/ios?target=Stash"

# Sub-Store uses a local request script; never resolve this synthetic host publicly.
hosts:
  sub.store: 127.0.0.1

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "sub.store"
    - "+.tailscale.com"
    - "+.apple.com"
    - "+.apple.com.cn"
    - "+.icloud.com"
    - "+.icloud.com.cn"
    - "+.icloud-content.com"
    - "+.icloud-content.com.cn"
    - "+.me.com"
    - "+.mac.com"

# Built-in Sub-Store request handling. Create a local Sub-Store subscription
# named "ios"; the provider below fetches its Stash output every hour.
http:
  mitm:
    - sub.store
  script:
    - match: ^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info)))
      name: sub-store-core
      type: request
      require-body: true
      max-size: -1
      timeout: 900
    - match: ^https?:\/\/sub\.store
      name: sub-store-ui
      type: request
      require-body: true
      max-size: -1
      timeout: 900

script-providers:
  sub-store-ui:
    url: https://cdn.jsdelivr.net/gh/sub-store-org/Sub-Store@release/sub-store-0.min.js
    interval: 86400
  sub-store-core:
    url: https://cdn.jsdelivr.net/gh/sub-store-org/Sub-Store@release/sub-store-1.min.js
