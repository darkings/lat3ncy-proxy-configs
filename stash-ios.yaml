# Stash iOS configuration
# Requires Stash iOS 3.4+ for the native Tailscale proxy type.
# Add private proxy providers locally; do not publish subscription URLs or auth keys.

mode: rule
log-level: warning
allow-lan: false
ipv6: false

# Stash uses this endpoint to read Subscription-Userinfo (traffic/expiry).
# The local Sub-Store subscription named "ios" must keep flow lookup enabled.
subscribe-url: "http://sub.store/download/ios?target=Stash"

# Sub-Store uses a local request script; never resolve this synthetic host publicly.
hosts:
  sub.store: 127.0.0.1

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "sub.store"
    - "+.tailscale.com"
    # 保留腾讯服务的真实 IP 兼容列表；分流可靠性由下方本地规则保证。
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.qpic.cn"
    - "+.qq.com"
    - "+.tencent.com"
    # Apple 与 iCloud 返回真实 IP；下方本地规则保证核心域名直连。
    - "+.apple.com"
    - "+.apple.com.cn"
    - "+.icloud.com"
    - "+.icloud.com.cn"
    - "+.icloud-content.com"
    - "+.icloud-content.com.cn"
    - "+.me.com"
    - "+.mac.com"
    - "+.mzstatic.com"
    - "+.aaplimg.com"
    - "+.cdn-apple.com"
    - "+.apple-cloudkit.com"

# Built-in Sub-Store request handling. Create a local Sub-Store subscription
# named "ios"; the provider below fetches its Stash output every 24 hours (interval: 86400).
http:
  mitm:
    - sub.store
  # 与 Sub-Store 官方 Stash.stoverride 完全一致：sub-store-1 处理后端重路由，
  # sub-store-0 负责前端与 /api/utils/env 探测。此组合在官方文档中已验证可用，
  # 修改匹配范围或调小 timeout 都可能导致前端要求填写后端地址。
  script:
    - match: ^https?:\/\/sub\.store\/((download)|api\/(preview|sync|(utils\/node-info)))
      name: sub-store-1
      type: request
      require-body: true
      max-size: -1
      timeout: 900
    - match: ^https?:\/\/sub\.store
      name: sub-store-0
      type: request
      require-body: true
      max-size: -1
      timeout: 900

script-providers:
  sub-store-0:
    url: https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-0.min.js
    interval: 86400
  sub-store-1:
    url: https://github.com/sub-store-org/Sub-Store/releases/latest/download/sub-store-1.min.js
    interval: 86400

# Complete first-time login from this node's "Tailscale Authentication" page.
# auth-key and exit-node are deliberately omitted from the public configuration.
proxies:
  - name: Tailscale-Node
    type: tailscale
    hostname: ios
    control-url: https://controlplane.tailscale.com
    ephemeral: false
    # This node is for Tailnet resources and has no required public exit node.
    benchmark-disabled: true

# The fixed name is public, while the private airport URL remains only in the
# local Sub-Store database. Do not replace this with the private source URL.
proxy-providers:
  SubStore:
    url: "http://sub.store/download/ios?target=Stash"
    path: ./providers/substore-ios.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    headers:
      User-Agent: Stash

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
    # 不在此展开 SubStore 的具体节点：顶层只暴露自动/直连/国家组。
    # 需要逐个挑节点时进入对应国家组选择即可，节点不会消失。
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png

  - name: Tailscale
    type: select
    proxies:
      - Tailscale-Node
      - DIRECT

  - name: Spotify
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png

  - name: Telegram
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png

  - name: OpenAI
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png

  - name: GitHub
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/github.png

  - name: Microsoft
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png

  - name: Google
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png

  - name: YouTube
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/YouTube.png

  - name: TikTok
    type: select
    proxies: [Proxy, DIRECT, Hong Kong, Taiwan, Japan, Singapore, United States]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TikTok.png

  - name: Hong Kong
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*(?:香港|港|🇭🇰|\bHK\b|Hong[ -]?Kong).*$'
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png

  - name: Taiwan
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*(?:台湾|台灣|臺灣|台北|臺北|🇹🇼|\bTW\b|Taiwan|Taipei).*$'
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png

  - name: Japan
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*(?:日本|东京|東京|大阪|🇯🇵|\bJP\b|Japan|Tokyo|Osaka).*$'
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png

  - name: Singapore
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*(?:新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore).*$'
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png

  - name: United States
    type: url-test
    use:
      - SubStore
    filter: '(?i)^(?!Tailscale(?:-Node)?$)(?!.*(?:群|邀请|返利|官网|客服|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|通知|频道|教程|更新|作者|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)).*(?:美国|美國|🇺🇸|\bUS(?:A)?\b|United[ -]?States|America|Los[ -]?Angeles|San[ -]?Jose|Seattle|New[ -]?York).*$'
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

  - name: Auto
    # 只在国家/地区组之间自动择优，不展开具体节点：
    # 1) 面板更清爽，不会把订阅里几十上百个节点铺在 Auto 里；
    # 2) 测速对象从“全部节点”降为 5 个国家组，显著降低 iOS 网络扩展的
    #    测速开销；每个国家组内部仍然是 url-test，会自动挑该国最快的节点。
    type: url-test
    proxies:
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
    interval: 1800
    lazy: true
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png

