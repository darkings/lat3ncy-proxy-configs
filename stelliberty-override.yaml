# Stelliberty / Mihomo Windows YAML 覆写
# 通过 Stelliberty 覆写页（本地或远程来源）绑定到节点订阅使用，由 Stelliberty 原生 Rust 引擎执行深度合并。
# 本文件完整接管 DNS、嗅探、策略组与分流规则；端口、系统代理、虚拟网卡等由 Stelliberty 界面管理。
# 不包含私人节点、订阅地址、密码或 Token，也不能作为普通订阅单独激活。

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "localhost.ptlogin2.qq.com"
    - "*.msftncsi.com"
    - "www.msftconnecttest.com"
    - "+.ts.net"
    - "+.tailscale.com"
    # Apple 与 iCloud 完全直连：返回真实 IP，避免 fake-ip 中转，加速同步
    - "+.apple.com"
    - "+.apple.com.cn"
    - "+.icloud.com"
    - "+.icloud.com.cn"
    - "+.icloud-content.com"
    - "+.icloud-content.com.cn"
    - "+.me.com"
    - "+.mac.com"
    - "+.mzstatic.com"
    - "+.aaplimg.com"
    - "+.cdn-apple.com"
    - "+.apple-cloudkit.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "+.ts.net": system
    "+.tailscale.com": system
  respect-rules: false

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
  skip-domain:
    - "+.lan"
    - "+.local"
    - "+.ts.net"
    - "+.tailscale.com"
  skip-dst-address:
    - 100.64.0.0/10
    - fd7a:115c:a1e0::/48

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States
    include-all: true
    exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|下次|版本|官址|备用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|好友|失联|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|EMAIL|PANEL|CHANNEL|AUTHOR|NOTICE|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)'

  - name: Spotify
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: Telegram
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: OpenAI
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: GitHub
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: Microsoft
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: Steam
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: Google
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: YouTube
    type: select
    proxies:
      - Proxy
      - DIRECT
      - Hong Kong
      - Taiwan
      - Japan
      - Singapore
      - United States

  - name: Auto
    type: url-test
    include-all: true
    exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|下次|版本|官址|备用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|好友|失联|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|EMAIL|PANEL|CHANNEL|AUTHOR|NOTICE|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)'
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 150
    lazy: false
    timeout: 5000
    max-failed-times: 3
    expected-status: 204

  - name: Hong Kong
    type: url-test
    include-all: true
    filter: '(?i)(香港|港|🇭🇰|\bHK\b|Hong[ -]?Kong)'
    exclude-filter: '(?i)(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|剩余|流量|套餐|到期|过期|有效期|已用|重置|机场|下次|版本|官址|备用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|好友|失联|\b(?:USE|USED|TOTAL|EXPIRE|EXPIRED|EMAIL|PANEL|CHANNEL|AUTHOR|NOTICE|TRAFFIC|REMAINING|RESET|BANDWIDTH)\d*\b|\d{4}-\d{2}-\d{2}|\dG)'
    url: https://www.gstatic.com/generate_204
